function doRestore(){
  let raw=document.getElementById("rs-code").value.replace(/[\s\u200b-\u200d\ufeff]+/g,"").replace(/^KFB1[:：]/i,"KFB1:");
  if(!raw.startsWith("KFB1:")){const i=raw.indexOf("eyJ");if(i>=0)raw="KFB1:"+raw.slice(i);}
  const msg=document.getElementById("rs-msg");msg.classList.add("err");
  if(!raw){msg.textContent=bt("empty");return;}
  let data;
  try{
    if(!raw.startsWith("KFB1:"))throw 0;
    data=JSON.parse(b64dec(raw.slice(5)));
    if(!data||typeof data.state!=="object")throw 0;
  }catch(e){msg.textContent=bt("bad");return;}
  // 合体（今ある記録は消さない）
  Object.entries(data.state).forEach(([tp,src])=>{
    if(!src||typeof src!=="object")return;
    if(!state[tp])state[tp]={mastered:{},weak:{},perfect:{}};
    const dst=state[tp];["mastered","weak","perfect"].forEach(k=>{if(!dst[k])dst[k]={};});
    Object.keys(src.perfect||{}).forEach(k=>{dst.perfect[k]=true;dst.mastered[k]=true;delete dst.weak[k];});
    Object.keys(src.mastered||{}).forEach(k=>{if(!dst.weak[k])dst.mastered[k]=true;});
    Object.entries(src.weak||{}).forEach(([k,v])=>{if(!dst.perfect[k]&&!dst.mastered[k])dst.weak[k]=Math.max(dst.weak[k]||0,Number(v)||1);});
  });
  const saved=saveState();
  if(Array.isArray(data.vtest)){
    let h=[];try{h=JSON.parse(localStorage.getItem("kf_vtest_v1"))||[];}catch(e){}
    const seen=new Set(h.map(x=>x.t));data.vtest.forEach(x=>{if(x&&x.t&&!seen.has(x.t))h.push(x);});
    h.sort((a,b)=>a.t-b.t);try{localStorage.setItem("kf_vtest_v1",JSON.stringify(h.slice(-50)));}catch(e){}
  }
  if(data.game&&typeof data.game==="object"){
    let g={};try{g=JSON.parse(localStorage.getItem("kf_game_v1"))||{};}catch(e){}
    Object.entries(data.game).forEach(([k,v])=>{g[k]=Math.max(g[k]||0,Number(v)||0);});
    try{localStorage.setItem("kf_game_v1",JSON.stringify(g));}catch(e){}
  }
  updateHome();
  if(!saved){msg.classList.add("err");msg.textContent=bt("saveFail");return;}
  msg.classList.remove("err");
  msg.innerHTML=esc(bt("done2"))+'<div class="bk-sum">'+levelSummary(state)+'</div>';
}

function loadVT(){try{return JSON.parse(localStorage.getItem(VT_KEY))||[];}catch(e){return [];}}

const VT={};

function vtPool(tp){return ALL_WORDS.filter(w=>w.topik===tp&&!GAME_EXCLUDE_POS[w.pos]);}
function vtChoices(w){
  const m=meaningOf(w),picked=[];
  const base=x=>x!==w&&x.ko!==w.ko&&!GAME_EXCLUDE_POS[x.pos]&&meaningOf(x)!==m&&!similarMeaning(meaningOf(x),m)
    &&!picked.some(p=>meaningOf(p)===meaningOf(x)||similarMeaning(meaningOf(p),meaningOf(x)));
  const near=ALL_WORDS.filter(x=>Math.abs(Number(x.topik)-Number(w.topik))<=1);
  const tries=[LOOSE_POS[w.pos]?near.filter(x=>!LOOSE_POS[x.pos]):near.filter(x=>x.pos===w.pos),near,ALL_WORDS];
  for(const list of tries){
    const cand=shuffle(list);
    for(const x of cand){if(picked.length>=3)break;if(base(x))picked.push(x);}
    if(picked.length>=3)break;
  }
  return shuffle([w,...picked]);
}

function startVTest(){
  try{audioUnlock();}catch(e){}
  const N=Number(currentTopik);
  const per=[];for(let l=1;l<=N;l++)per.push(Math.floor(VT_TOTAL/N)+((l<=VT_TOTAL%N)?1:0));
  const qs=[];
  for(let l=1;l<=N;l++){
    const pool=shuffle(vtPool(String(l)));
    if(pool.length<4){alert(vtt("few"));return;}
    pool.slice(0,per[l-1]).forEach(w=>qs.push({w,lv:l}));
  }
  const order=shuffle(qs);
  const nListen=Math.round(order.length*VT_LISTEN_RATE);
  order.forEach((q,i)=>{q.listen=i<nListen;q.choices=vtChoices(q.w);});
  Object.assign(VT,{N,qs:shuffle(order),i:-1,res:[],timer:null,t0:0,answered:false,active:true,run:(VT.run||0)+1});
  document.getElementById("vt-intro").style.display="none";
  document.getElementById("vt-q").style.display="flex";
  vtNext();
}

function vtNext(){
  clearInterval(VT.timer);
  if(!VT.active)return;
  VT.i++;
  if(VT.i>=VT.qs.length){vtFinish();return;}
  const q=VT.qs[VT.i];VT.answered=false;
  document.getElementById("vt-prog").style.width=(VT.i/VT.qs.length*100)+"%";
  document.getElementById("vt-count").textContent=(VT.i+1)+"/"+VT.qs.length;
  const word=document.getElementById("vt-word");
  VT.started=false;
  if(q.listen){
    // 自動で読み上げる。鳴り始めたらタイマー開始。鳴らなかった端末だけ「タップして聞く」を出す
    word.innerHTML=`<div class="vt-listen">${vtt("listen")}</div><button class="vt-replay" id="vt-play" onclick="vtSpeak(true)">🔊 ${vtt("replay")}</button>`;
    vtSpeak(false);
    const qi=VT.i;
    setTimeout(()=>{if(VT.i===qi&&!VT.started&&!VT.answered){const b=document.getElementById("vt-play");if(b){b.classList.add("big");b.textContent="🔊 "+vtt("tapPlay");}}},900);
  }else{
    word.innerHTML=`<div class="vt-ko">${esc(q.w.ko)}</div>`;
  }
  const box=document.getElementById("vt-choices");box.innerHTML="";
  q.choices.forEach((c,ci)=>{
    const b=document.createElement("button");b.className="vt-choice";b.textContent=meaningOf(c);
    b.onclick=()=>vtAnswer(ci);box.appendChild(b);
  });
  const dk=document.createElement("button");dk.className="vt-choice vt-dk";dk.textContent=vtt("dontKnow");dk.onclick=()=>vtAnswer(-1);box.appendChild(dk);
  const bar=document.getElementById("vt-timer");bar.style.width="100%";bar.classList.remove("low");
  if(!q.listen)vtStartTimer();
}
function vtStartTimer(){
  if(!VT.active||VT.started||VT.answered)return;VT.started=true;
  const q=VT.qs[VT.i];const limit=q.listen?VT_TIME_LISTEN:VT_TIME;
  VT.t0=performance.now();
  const bar=document.getElementById("vt-timer");
  clearInterval(VT.timer);
  VT.timer=setInterval(()=>{
    const el=(performance.now()-VT.t0)/1000,left=Math.max(0,1-el/limit);
    bar.style.width=(left*100)+"%";bar.classList.toggle("low",left<0.35);
    if(el>=limit)vtAnswer(-2);
  },50);
}
function vtSpeak(byTap){
  const q=VT.qs[VT.i];if(!q)return;
  try{const run=VT.run;const u=koUtter(q.w.ko,0.9);u.onstart=()=>{if(VT.active&&VT.run===run)vtStartTimer();};speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
  if(byTap){const b=document.getElementById("vt-play");if(b){b.classList.remove("big");b.textContent="🔊 "+vtt("replay");}setTimeout(vtStartTimer,600);}
}

function vtAnswer(ci){
  if(!VT.active||VT.answered)return;VT.answered=true;clearInterval(VT.timer);
  const q=VT.qs[VT.i];
  const correctIdx=q.choices.indexOf(q.w);
  const kind=ci===correctIdx?"r":(ci>=0?"w":"s");   // r=正解 w=不正解 s=わからない/時間切れ
  VT.res.push({w:q.w,lv:q.lv,listen:q.listen,kind,timeout:ci===-2});
  const btns=document.querySelectorAll("#vt-choices .vt-choice");
  btns.forEach((b,bi)=>{b.disabled=true;if(bi===correctIdx)b.classList.add("ok");else if(bi===ci)b.classList.add("ng");});
  if(q.listen)document.getElementById("vt-word").innerHTML=`<div class="vt-ko">${esc(q.w.ko)}</div>`;
  try{if(kind==="r")sfx("beep");}catch(e){}
  const wait=kind==="r"?450:1100;
  const run=VT.run;
  setTimeout(()=>{if(VT.active&&VT.run===run)vtNext();},wait);
}

function vtFinish(){
  if(!VT.active)return;VT.active=false;clearInterval(VT.timer);
  const N=VT.N;const lines={};let knownTotal=0;
  const sizes={},pHat={};
  for(let l=1;l<=N;l++){
    const rs=VT.res.filter(r=>r.lv===l);const n=rs.length||1;
    const R=rs.filter(r=>r.kind==="r").length,W=rs.filter(r=>r.kind==="w").length;
    pHat[l]=Math.max(0,Math.min(1,(R-W/3)/n));   // 4択のまぐれ当たりを補正
    sizes[l]=vtPool(String(l)).length;
  }
  for(let g=1;g<=N;g++){
    let k=0,s=0;for(let l=1;l<=g;l++){k+=pHat[l]*sizes[l];s+=sizes[l];}
    lines[g]=Math.round(k/s*100);
  }
  for(let l=1;l<=N;l++)knownTotal+=pHat[l]*sizes[l];
  const R=VT.res.filter(r=>r.kind==="r").length,W=VT.res.filter(r=>r.kind==="w").length,S=VT.res.length-R-W;
  const L=VT.res.filter(r=>r.listen),La=L.filter(r=>r.kind==="r").length;
  // 漢字語・外来語（推測が効く）と固有語（推測が効きにくい）に分けて採点
  const isKata=j=>{j=(j||"").replace(/[（(].*?[）)]/g,"");const c=[...j].filter(ch=>!/[\s・ー〜、,\/]/.test(ch));return c.length>0&&c.filter(ch=>ch>="\u30A0"&&ch<="\u30FF").length/c.length>=0.6;};
  const isGuessable=w=>!!w.hanja||isKata(w.jp);
  const grp=f=>{const g=VT.res.filter(f),n=g.length,r=g.filter(x=>x.kind==="r").length,w=g.filter(x=>x.kind==="w").length;return {n,p:n?Math.round(Math.max(0,Math.min(1,(r-w/3)/n))*100):null};};
  const gSino=grp(x=>isGuessable(x.w)),gNative=grp(x=>!isGuessable(x.w));
  const hist=loadVT();const prev=[...hist].reverse().find(h=>h.topik===String(N));
  const prevBest=hist.filter(h=>h.topik===String(N)).reduce((m,h)=>Math.max(m,h.ready),-1);
  const rec={t:Date.now(),topik:String(N),ready:lines[N],lines,known:Math.round(knownTotal),r:R,w:W,s:S,sino:gSino.p,native:gNative.p};
  hist.push(rec);saveVT(hist);
  // 間違えた・わからなかった単語を苦手リストへ
  const missed=VT.res.filter(r=>r.kind!=="r").map(r=>r.w);
  missed.forEach(w=>{const st=state[w.topik];if(!st)return;const k=K(w);st.weak[k]=(st.weak[k]||0)+1;delete st.mastered[k];delete st.perfect[k];});
  if(missed.length)saveState();
  // 表示
  const lvLabel=p=>vtt("lv")[p>=90?3:p>=75?2:p>=55?1:0];
  const col=p=>p>=90?"#4ade80":p>=75?"#ffd76a":p>=55?"#fb923c":"#fb7185";
  const diff=prev?rec.ready-prev.ready:null;
  const bars=Object.keys(lines).map(g=>`<div class="vt-bar"><span class="vt-bl">${vtt("line").replace("{n}",g)}</span><div class="vt-bt"><div class="vt-bf" style="width:${lines[g]}%;background:${col(lines[g])}"></div></div><b style="color:${col(lines[g])}">${lines[g]}%</b></div>`).join("");
  const allBest=Math.max(prevBest,rec.ready);
  const histRows=hist.filter(h=>h.topik===String(N)).slice(-5).reverse().map(h=>{const d=new Date(h.t);return `<div class="vt-hrow"><span>${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}</span><b style="color:${col(h.ready)}">${h.ready===allBest?"🏆 ":""}${h.ready}%</b></div>`;}).join("");
  const res=document.getElementById("vresult");
  res.innerHTML=`<h2>${vtt("resTitle")}</h2>
    <div class="vt-ring" style="--p:${rec.ready};--c:${col(rec.ready)}"><div class="vt-ring-in"><div class="vt-pct">${rec.ready}<small>%</small></div><div class="vt-lvl" style="color:${col(rec.ready)}">${lvLabel(rec.ready)}</div></div></div>
    <div class="vt-sub">${vtt("readiness").replace("{n}",N)}</div>
    ${prevBest>=0&&rec.ready>prevBest?`<div class="vt-newbest">${vtt("newBest")}</div>`:""}
    <div class="vt-delta">${diff===null?vtt("first"):vtt("prev").replace("{d}",(diff>=0?"+":"")+diff+"%")}${prevBest>=0?" ・ "+vtt("bestIs").replace("{p}",Math.max(prevBest,rec.ready)):""}</div>
    ${gNative.n?`<div class="vt-card vt-split"><h4 class="vt-h4">${vtt("splitTitle")}</h4>
      <div class="vt-bar"><span class="vt-bl vt-bl2">${vtt("native")}</span><div class="vt-bt"><div class="vt-bf" style="width:${gNative.p}%;background:${col(gNative.p)}"></div></div><b style="color:${col(gNative.p)}">${gNative.p}%</b></div>
      <div class="vt-bar"><span class="vt-bl vt-bl2">${vtt("sino")}</span><div class="vt-bt"><div class="vt-bf" style="width:${gSino.p??0}%;background:${col(gSino.p??0)}"></div></div><b style="color:${col(gSino.p??0)}">${gSino.p??"-"}%</b></div>
      <div class="vt-detail">${vtt("splitNote").replace("{a}",gNative.n).replace("{b}",gSino.n)}</div></div>`:""}
    <div class="vt-card">${bars}<div class="vt-known">${vtt("known").replace("{k}",rec.known.toLocaleString())}</div>
      <div class="vt-detail">${vtt("detail").replace("{r}",R).replace("{w}",W).replace("{s}",S)}${L.length?" ・ "+vtt("listenAcc").replace("{a}",La).replace("{b}",L.length):""}</div></div>
    ${missed.length?`<div class="go-missed"><h4>${vtt("missed")}</h4>${missed.map(w=>`<div class="row"><b>${esc(w.ko)}</b><span>${esc(meaningOf(w))}</span></div>`).join("")}<div class="note">${vtt("added")}</div></div>`:""}
    <div class="vt-card"><h4 class="vt-h4">${vtt("history")}</h4>${histRows}</div>
    <p class="vt-note">${vtt("note")}</p>
    <button class="done-btn white" onclick="openVTest()">${vtt("again")}</button>
    <button class="done-btn white" onclick="goHome()">${vtt("home")}</button>`;
  showScreen("vresult");res.scrollTop=0;
}
function quitVTest(){VT.active=false;clearInterval(VT.timer);try{speechSynthesis.cancel();}catch(e){}goHome();}
</script>
</body>
